<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #000000;
    color: #ffffff;
    line-height: 1.6;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    background: #1a1a1a;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(255, 255, 255, 0.1);
    padding: 40px;
}

header {
    margin-bottom: 32px;
}

header h1 {
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 4px;
}

.subtitle {
    color: #b0b0b0;
    font-size: 14px;
}

.add-task-container {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
}

.task-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #404040;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
    background: #2a2a2a;
    color: #ffffff;
}

.task-input:focus {
    outline: none;
    border-color: #2383e2;
    box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.2);
}

.task-input::placeholder {
    color: #666666;
}

.date-input {
    padding: 12px 16px;
    border: 1px solid #404040;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
    background: #2a2a2a;
    color: #ffffff;
    cursor: pointer;
}

.date-input:focus {
    outline: none;
    border-color: #2383e2;
    box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.2);
}

.date-input::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
}

.add-btn {
    padding: 12px 24px;
    background: #2383e2;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}

.add-btn:hover {
    background: #1a73d0;
}

.add-btn:active {
    transform: translateY(1px);
}

.tasks-section {
    margin-bottom: 24px;
}

.tasks-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.tasks-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
}

.task-count {
    font-size: 13px;
    color: #b0b0b0;
}

.task-list {
    list-style: none;
}

.task-item {
    display: flex;
    align-items: center;
    padding: 12px;
    margin-bottom: 4px;
    border-radius: 6px;
    transition: background 0.2s;
    cursor: pointer;
    gap: 12px;
}

.task-item:hover {
    background: #2a2a2a;
}

.task-checkbox {
    width: 18px;
    height: 18px;
    border: 1.5px solid #606060;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.task-checkbox:hover {
    border-color: #2383e2;
}

.task-checkbox.checked {
    background: #2383e2;
    border-color: #2383e2;
}

.task-checkbox.checked::after {
    content: "✓";
    color: white;
    font-size: 12px;
    font-weight: bold;
}

.task-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.task-text {
    font-size: 14px;
    color: #ffffff;
    transition: all 0.2s;
}

.task-text.completed {
    color: #707070;
    text-decoration: line-through;
}

.task-date {
    font-size: 12px;
    color: #888888;
    display: flex;
    align-items: center;
    gap: 4px;
}

.task-date.overdue {
    color: #ff6b6b;
}

.task-date.today {
    color: #ffd93d;
}

.delete-btn {
    opacity: 0;
    background: none;
    border: none;
    color: #888888;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s;
}

.task-item:hover .delete-btn {
    opacity: 1;
}

.delete-btn:hover {
    background: #3a1a1a;
    color: #ff6b6b;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #666666;
}

.empty-state.hidden {
    display: none;
}

.empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
}

.empty-state p {
    font-size: 14px;
}

@media (max-width: 600px) {
    .container {
        padding: 24px;
    }

    header h1 {
        font-size: 24px;
    }

    .add-task-container {
        flex-direction: column;
    }

    .add-btn {
        width: 100%;
    }

    .date-input {
        width: 100%;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Tasks</h1>
            <p class="subtitle">Keep track of what needs to be done</p>
        </header>

        <div class="add-task-container">
            <input
                type="text"
                id="taskInput"
                placeholder="Add a new task..."
                class="task-input"
            >
            <input
                type="date"
                id="dateInput"
                class="date-input"
            >
            <button id="addTaskBtn" class="add-btn">Add Task</button>
        </div>

        <div class="tasks-section">
            <div class="tasks-header">
                <h2>Tasks</h2>
                <span id="taskCount" class="task-count">0 tasks</span>
            </div>
            <ul id="taskList" class="task-list"></ul>
        </div>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">✨</div>
            <p>No tasks yet. Add one to get started!</p>
        </div>
    </div>

    <script>
// DOM Elements
const taskInput = document.getElementById('taskInput');
const dateInput = document.getElementById('dateInput');
const addTaskBtn = document.getElementById('addTaskBtn');
const taskList = document.getElementById('taskList');
const taskCount = document.getElementById('taskCount');
const emptyState = document.getElementById('emptyState');

// Tasks array
let tasks = [];

// Initialize app
document.addEventListener('DOMContentLoaded', () => {
    loadTasks();
    renderTasks();
    updateTaskCount();
});

// Event Listeners
addTaskBtn.addEventListener('click', addTask);
taskInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        addTask();
    }
});

// Add new task
function addTask() {
    const taskText = taskInput.value.trim();

    if (taskText === '') {
        return;
    }

    const task = {
        id: Date.now(),
        text: taskText,
        date: dateInput.value || null,
        completed: false
    };

    tasks.push(task);
    taskInput.value = '';
    dateInput.value = '';

    saveTasks();
    renderTasks();
    updateTaskCount();
}

// Toggle task completion
function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
        updateTaskCount();
    }
}

// Delete task
function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    renderTasks();
    updateTaskCount();
}

// Render all tasks
function renderTasks() {
    taskList.innerHTML = '';

    if (tasks.length === 0) {
        emptyState.classList.remove('hidden');
        return;
    }

    emptyState.classList.add('hidden');

    tasks.forEach(task => {
        const taskItem = createTaskElement(task);
        taskList.appendChild(taskItem);
    });
}

// Create task element
function createTaskElement(task) {
    const li = document.createElement('li');
    li.className = 'task-item';

    // Checkbox
    const checkbox = document.createElement('div');
    checkbox.className = `task-checkbox ${task.completed ? 'checked' : ''}`;
    checkbox.addEventListener('click', () => toggleTask(task.id));

    // Task content container
    const taskContent = document.createElement('div');
    taskContent.className = 'task-content';
    taskContent.addEventListener('click', () => toggleTask(task.id));

    // Task text
    const taskText = document.createElement('div');
    taskText.className = `task-text ${task.completed ? 'completed' : ''}`;
    taskText.textContent = task.text;

    taskContent.appendChild(taskText);

    // Task date (if exists)
    if (task.date) {
        const taskDate = document.createElement('div');
        const dateObj = new Date(task.date);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const taskDateObj = new Date(task.date);
        taskDateObj.setHours(0, 0, 0, 0);

        let dateClass = 'task-date';
        let dateIcon = '📅';

        if (taskDateObj < today && !task.completed) {
            dateClass += ' overdue';
            dateIcon = '⚠️';
        } else if (taskDateObj.getTime() === today.getTime()) {
            dateClass += ' today';
            dateIcon = '⭐';
        }

        taskDate.className = dateClass;
        taskDate.innerHTML = `${dateIcon} ${formatDate(task.date)}`;
        taskContent.appendChild(taskDate);
    }

    // Delete button
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.textContent = '×';
    deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(task.id);
    });

    li.appendChild(checkbox);
    li.appendChild(taskContent);
    li.appendChild(deleteBtn);

    return li;
}

// Format date for display
function formatDate(dateString) {
    const date = new Date(dateString);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dateToCheck = new Date(dateString);
    dateToCheck.setHours(0, 0, 0, 0);

    if (dateToCheck.getTime() === today.getTime()) {
        return 'Today';
    } else if (dateToCheck.getTime() === tomorrow.getTime()) {
        return 'Tomorrow';
    } else {
        const options = { month: 'short', day: 'numeric', year: 'numeric' };
        return date.toLocaleDateString('en-US', options);
    }
}

// Update task count
function updateTaskCount() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const pending = total - completed;

    if (total === 0) {
        taskCount.textContent = '0 tasks';
    } else if (pending === 0) {
        taskCount.textContent = `All ${total} tasks completed!`;
    } else {
        taskCount.textContent = `${pending} of ${total} tasks remaining`;
    }
}

// Save tasks to localStorage
function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
}

// Load tasks from localStorage
function loadTasks() {
    const storedTasks = localStorage.getItem('tasks');
    if (storedTasks) {
        tasks = JSON.parse(storedTasks);
    }
}
    </script>
</body>
</html>
